{% extends "base.html" %}


{% block conteudo %}


<h2>Bibliotecários Cadastrados</h2>


<p>
    <a href="/bibliotecarios/novo">Cadastrar novo bibliotecário</a>
</p>


<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
        </tr>
    </thead>


    <tbody>
        {% for bibliotecario in bibliotecarios %}
        <tr>
            <td>{{ bibliotecario.id_bibliotecario }}</td>
            <td>{{ bibliotecario.nome }}</td>
            <td>{{ bibliotecario.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>


{% endblock %}
